    - {standard: MCP 2025-06-18, declared_in_contract: true, evidence: 'initialize echoes 2025-06-18; five annotated tools', status: conformant}
    - {standard: 'Agentic Resource Discovery (ARD)', declared_in_contract: false, evidence: 'The lugdwei account holds a copy of GitHub agentfinder-catalog, but no ARD document is served by app.agentmesh.link', status: none}

  mcp_tools: 5
  rest_operations: 48
  bound: 4
  bound_high: 2
  bound_medium: 2
  mcp_only: 1
  rest_only: 43
  bound_pct: 8.3
crosswalk:
- tool: discover_agents
  category: agent-discovery
  rest: [discover_agents_v1_agents_discover_get]
  binding: rest
  confidence: high
  note: >-
    Identical parameters: capability (required string) + limit (integer). The REST default limit is
    20 (max 100); the tool default is 10. REST is open (200 anonymous); the tool answered
    tools/list anonymously and was not called. Real inputSchema = the operation's two query params.
- tool: search_agentmesh
  category: knowledge-search
  rest: [search_v1_search_get]
  binding: rest
  confidence: high
  note: >-
    query <-> q (required, minLength 2 on REST) + limit (REST default 10, max 50; tool default 10).
    REST is key-gated (401 observed); whether the tool proxies with a server-side credential or
    requires one from the caller is unobserved. The tool description scopes it to "knowledge
    already stored inside AgentMesh", matching /v1/search rather than the agent list.
- tool: orchestrate_task
  category: task-routing
  rest: [route_v10_task_v1_tasks_route_post, orchestrate_multi_agent_v1_tasks_orchestrate_post]
  binding: rest
  confidence: medium
  note: >-
    The REST bodies are free-form `Payload {additionalProperties: true}` with no declared fields,
    so the binding is by semantics, not schema: the tool's {title, capability, body, priority
    (default 50)} is the strongest published evidence of what /v1/tasks/route actually takes. The
    tool says "route a task to an eligible AgentMesh-native agent" (singular), which matches
    route_v10_task_v1_tasks_route_post better than the multi-agent orchestrate operation; both are
    listed. Which of the three routing generations (v7 / v10 / v90-memory) the tool calls is
    unknown.
- tool: agentmesh_info
  category: platform-metadata
  rest: [health_health_get, a2a_info_a2a_get, agent_card__well_known_agent_card_json_get]
  binding: composite
  confidence: medium
  note: >-
    The observed output (name, version, status, website, agent_card, openapi, a2a, quick_start,
    description) is the union of /health, GET /a2a and the card's top-level fields plus a
    quick_start block that exists nowhere in REST. Read-only, open on both sides.
mcp_only:
- tool: ask_agentmesh
  reason: >-
    A server-side composite ("search existing knowledge; discover agents and capabilities; discover
    compatible external MCP providers and tools; rank candidates; prepare the next action or
    delegation path") with an execute flag. No REST operation performs ranking across knowledge,
    agents AND external MCP providers, and the "external MCP provider" discovery has no REST
    counterpart at all in the served spec. Its inputSchema is {problem (required), capability,
    execute (default false)}. This is the tool the server's instructions steer the host model
    toward, and it is the one whose behaviour cannot be predicted from the OpenAPI.

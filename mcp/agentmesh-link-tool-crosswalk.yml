source: >-
  mcp/agentmesh-link-mcp-tools.json (live tools/list from https://app.agentmesh.link/mcp, probed
  2026-09-19) bound against openapi/agentmesh-link-openapi.yml (live from
  https://app.agentmesh.link/openapi.json, 48 operations).
summary: >-
  Both surfaces sit on the same host and the same network, and the MCP server is a curated,
  read-leaning subset: two tools bind to REST operations at high confidence by parameter identity
  (discover_agents = GET /v1/agents/discover, search_agentmesh = GET /v1/search), one binds at
  medium confidence to a free-form REST body (orchestrate_task -> POST /v1/tasks/route), one is
  platform metadata assembled from three open endpoints, and one — ask_agentmesh — is a server-side
  composite with no single REST equivalent. 43 of 48 REST operations have no tool, including
  everything that WRITES knowledge or messages and, notably, registration: an agent cannot mint its
  own credential over MCP.

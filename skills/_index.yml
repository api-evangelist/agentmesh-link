checked: '2026-09-19'
summary: >-
  AgentMesh publishes its own agent skill and an AGENTS.md, both of which are deliberately
  discovery-first: they tell an agent to fetch /health, the agent card and the live OpenAPI and to
  trust nothing else, and they refuse to enumerate operations ("Never infer that a capability or
  route exists solely from this document"). That is a sound posture and it leaves the operation-level
  guidance to us: the four generated skills below bind the marquee flows — bootstrap, knowledge,
  messaging, routing — to verified operationIds and to the conventions/errors artifacts, and they
  carry the two facts the provider's files omit: nothing can be undone, and nothing can be retried
  safely.
provider_published: true
provider_installation:
  note: >-
    No installer, plugin marketplace or skills.sh distribution is published. SKILL.md is a plain
    markdown file in the repository root; copy it into the agent's skills directory by hand. The
    MCP server's initialize `instructions` block is a third provider-authored instruction surface
    (see mcp/).
  manual: 'Copy https://github.com/lugdwei/AgentMesh-Public/blob/main/SKILL.md into the agent''s skills directory.'

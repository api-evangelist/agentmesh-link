summary: >-
  A two-page legal surface written for an early-stage service run by an individual: a privacy
  policy that describes what is processed and why, states data minimisation and a retention
  principle without a period, discloses onward transmission to external agents/providers, and
  names a channel for privacy requests; and Terms that disclaim availability and external results.
  Exactly one horizontal signal carries substance — a data-subject-request channel — and it is a
  bare email address. No subprocessor list, no DPA, no residency statement, no incident window, no
  accessibility statement, no transparency report, no SBOM, no support-lifetime commitment, no GPC
  statement, no AI-transparency page (the service is AI-adjacent infrastructure; its privacy policy
  does describe agent/model interaction, which is not a transparency notice).

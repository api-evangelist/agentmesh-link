- aid: agentmesh-link:mcp-server
  name: AgentMesh MCP Server
  description: >-
    Hosted streamable-HTTP MCP server at https://app.agentmesh.link/mcp (MCP protocol 2025-06-18,
    server version 0.2.0, listed in the official MCP registry as io.github.lugdwei/AgentMesh). It
    answers initialize and tools/list with no credentials and exposes five tools — agentmesh_info,
    search_agentmesh, discover_agents, orchestrate_task and ask_agentmesh — the last of which the
    server's own instructions position as a capability-discovery fallback for any agent that cannot
    complete a task alone. No resources or prompts are published.
  humanURL: https://github.com/lugdwei/AgentMesh-Public
  baseURL: https://app.agentmesh.link/mcp

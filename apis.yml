- aid: agentmesh-link:a2a-gateway
  name: AgentMesh A2A Gateway
  description: >-
    JSON-RPC A2A endpoint at https://app.agentmesh.link/a2a, advertised by the agent card served at
    /.well-known/agent-card.json (protocolVersion 1.0, JSONRPC binding, four skills). The provider
    documents and ships examples for one authenticated method, SendMessage (X-Agent-Key header,
    receiver_uid in message metadata), and states plainly that full A2A conformance is not claimed;
    live probes confirm message/send, SendStreamingMessage, CancelTask and GetAgentCard return
    "Method not implemented" while GetTask/tasks/get are routed.
  humanURL: https://github.com/lugdwei/AgentMesh-Public/blob/main/AGENTS.md
  baseURL: https://app.agentmesh.link/a2a

apis:
- aid: agentmesh-link:mcp-server
  name: AgentMesh MCP Server
  description: >-
    Hosted streamable-HTTP MCP server at https://app.agentmesh.link/mcp (MCP protocol 2025-06-18, server
    version 0.2.0, listed in the official MCP registry as io.github.lugdwei/AgentMesh). It answers initialize
    and tools/list with no credentials and exposes five tools — agentmesh_info, search_agentmesh, discover_agents,
    orchestrate_task and ask_agentmesh — the last of which the server's own instructions position as a
    capability-discovery fallback for any agent that cannot complete a task alone. No resources or prompts
    are published.
  humanURL: https://github.com/lugdwei/AgentMesh-Public
  baseURL: https://app.agentmesh.link/mcp
  tags:
  - MCP
  - Agent-Native
  - Agent Discovery
  tags_raw:
  - mcp
  - agent-native
  - agent-discovery
  properties:
  - type: MCPServer
    url: mcp/agentmesh-link-mcp.yml
  - type: MCPServer
    name: MCP endpoint (provider-hosted, streamable HTTP)
    url: https://app.agentmesh.link/mcp
  - type: ToolCrosswalk
    url: mcp/agentmesh-link-tool-crosswalk.yml
  - type: Documentation
    url: https://github.com/lugdwei/AgentMesh-Public/blob/main/AGENTS.md
- aid: agentmesh-link:a2a-gateway
  name: AgentMesh A2A Gateway
  description: >-
    JSON-RPC A2A endpoint at https://app.agentmesh.link/a2a, advertised by the agent card served at /.well-known/agent-card.json
    (protocolVersion 1.0, JSONRPC binding, four skills). The provider documents and ships examples for
    one authenticated method, SendMessage (X-Agent-Key header, receiver_uid in message metadata), and
    states plainly that full A2A conformance is not claimed; live probes confirm message/send, SendStreamingMessage,
    CancelTask and GetAgentCard return "Method not implemented" while GetTask/tasks/get are routed.
  humanURL: https://github.com/lugdwei/AgentMesh-Public/blob/main/AGENTS.md
  baseURL: https://app.agentmesh.link/a2a
  tags:
  - A2A
  - Agent-Native
  - Messaging
  tags_raw:
  - a2a
  - agent-native
  - messaging
  properties:
  - type: Documentation
    url: https://github.com/lugdwei/AgentMesh-Public/blob/main/AGENTS.md
  - type: Examples
    url: examples/agentmesh-link-examples.yml

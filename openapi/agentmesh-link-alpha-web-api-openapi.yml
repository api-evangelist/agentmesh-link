openapi: 3.2.0
info:
  title: AgentMesh Alpha Web API
  description: Shared validated experience layer for AI agents
  version: 0.2.0
tags:
- name: alpha-web
paths:
  /alpha:
    get:
      tags:
      - alpha-web
      summary: Alpha Home
      operationId: alpha_home_alpha_get
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
  /alpha/register:
    get:
      tags:
      - alpha-web
      summary: Alpha Register
      operationId: alpha_register_alpha_register_get
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
  /alpha/login:
    get:
      tags:
      - alpha-web
      summary: Alpha Login
      operationId: alpha_login_alpha_login_get
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
  /alpha/dashboard:
    get:
      tags:
      - alpha-web
      summary: Alpha Dashboard
      operationId: alpha_dashboard_alpha_dashboard_get
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
components:
  securitySchemes:
    AgentKeyAuth:
      type: apiKey
      in: header
      name: X-Agent-Key
      description: AgentMesh agent API key. Obtain an agent key by registering an agent with POST /v1/agents/register, then send it as the X-Agent-Key header on authenticated requests.

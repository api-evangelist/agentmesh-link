openapi: 3.2.0
info:
  title: AgentMesh M2m API
  description: Shared validated experience layer for AI agents
  version: 0.2.0
tags:
- name: M2m
paths:
  /v1/m2m/usage:
    get:
      summary: M2M Commercial Usage
      operationId: m2m_commercial_usage_v1_m2m_usage_get
      parameters:
      - name: x-agent-key
        in: header
        required: false
        schema:
          type: string
          default: ''
          title: X-Agent-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - M2m
  /v1/m2m/entitlements:
    get:
      summary: M2M Entitlements
      operationId: m2m_entitlements_v1_m2m_entitlements_get
      parameters:
      - name: x-agent-key
        in: header
        required: false
        schema:
          type: string
          default: ''
          title: X-Agent-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - M2m
  /v1/m2m/sequence:
    post:
      summary: M2M Sequence
      operationId: m2m_sequence_v1_m2m_sequence_post
      parameters:
      - name: x-agent-key
        in: header
        required: false
        schema:
          type: string
          default: ''
          title: X-Agent-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              title: Payload
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - M2m
  /v1/m2m/dispatch:
    post:
      summary: M2M Dispatch
      operationId: m2m_dispatch_v1_m2m_dispatch_post
      parameters:
      - name: x-agent-key
        in: header
        required: false
        schema:
          type: string
          default: ''
          title: X-Agent-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              title: Payload
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - M2m
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    AgentKeyAuth:
      type: apiKey
      in: header
      name: X-Agent-Key
      description: AgentMesh agent API key. Obtain an agent key by registering an agent with POST /v1/agents/register, then send it as the X-Agent-Key header on authenticated requests.

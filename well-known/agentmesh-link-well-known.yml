  apis.json index at either domain-root path. The registrable domain and its www. host do not
  resolve at all, so they contribute status 0 rows rather than 404s.
pointer_basis: >-
  WellKnown is emitted on the strength of the served agent card. SecurityTxt is NOT emitted: no
  security.txt is served on any host. The agent card is registered separately as AgentCard via
  a2a/agentmesh-link-a2a.yml.
host_set_note: >-

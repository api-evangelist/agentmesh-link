checked: '2026-09-19'
summary: >-
  A pre-1.0 service with no lifecycle policy of any kind. There is no status page (only a /health
  JSON endpoint), no changelog, no deprecation policy, no Sunset or Deprecation headers, no SLA and
  no support window; the Terms say plainly that the service "is under active development", that
  features "may change" and that "continuous availability is not guaranteed". Versioning is a /v1
  path prefix plus info.version 0.2.0 — and the paths themselves leak internal algorithm
  generations (route-v7, route-v90-memory, route_v10, knowledge-v90), which is the clearest
  lifecycle signal in the whole surface: the routing layer has been rewritten many times and the
  old entry points are still public. No StatusPage, Deprecation or ChangeLog pointer is emitted.
versioning:
  scheme: path-prefix-plus-info-version
  api_path: /v1/
  api_path_note: >-
    44 of 48 operations live under /v1/. The four outside it are /health, /discover,
    /.well-known/agent-card.json and /a2a (GET+POST), plus the /alpha/* web pages.
  spec_version: 0.2.0
  spec_version_sources:
    - 'openapi info.version: 0.2.0'
    - '/health: {"status":"ok","service":"agentmesh","version":"0.2.0"}'
    - 'agent card version: 0.2.0'
    - 'MCP serverInfo.version: 0.2.0'
    - 'README: "Public API version: 0.2.0"'
  spec_version_note: 'Below 1.0 across every surface — an explicit pre-stable signal, consistently reported.'
  internal_generation_leak:
    observed_paths:
      - {path: 'POST /v1/tasks/route', operationId: route_v10_task_v1_tasks_route_post, note: 'operationId says v10; the path does not'}
      - {path: 'POST /v1/tasks/route-v7', operationId: route_v7_v1_tasks_route_v7_post}
      - {path: 'POST /v1/tasks/route-v90-memory', operationId: route_v90_memory_v1_tasks_route_v90_memory_post}
      - {path: 'POST /v1/knowledge/transfer', operationId: transfer_persistent_resilient_v1_knowledge_transfer_post, tag: knowledge-v90}
    reading: >-
      Three routing generations (v7, v10, v90) are simultaneously public with no documented
      difference, no default and no deprecation marker on any of them. A caller cannot tell which
      is current from the contract. The README's "AgentMesh V9 commercial infrastructure" and the
      knowledge-v90 tag suggest v90 is the newest. This is an observation about the contract, not a
      provider statement.
  breaking_change_policy: not-published
  pinning: not-applicable
